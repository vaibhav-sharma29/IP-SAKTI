version: "3.9"

services:
  backend:
    build: ./backend
    container_name: ip_sakti_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ip_sakti_frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    restart: unless-stopped
